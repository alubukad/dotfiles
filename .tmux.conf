# ── prefix ────────────────────────────────────────────────
unbind-key C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ── terminal ──────────────────────────────────────────────
set -s default-terminal 'tmux-256color'
set -as terminal-features ',xterm-ghostty:RGB:usstyle:hyperlinks'
set -as terminal-features ',alacritty:RGB:usstyle'
set -g allow-passthrough on

# ── general ───────────────────────────────────────────────
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g focus-events on
set -g detach-on-destroy off
set -g mouse on
set -g mode-keys vi
set -g status-keys vi

set-window-option -g automatic-rename on
set-option -g set-titles on
set -g set-titles-string "#T"

# ── status bar: palette (Material Darker) ─────────────────
%hidden SB_BG='#212121'
%hidden SB_PANEL='#2f2f2f'
%hidden SB_FG='#eeffff'
%hidden SB_DIM='#6d6d6d'
%hidden SB_BLUE='#82aaff'
%hidden SB_CYAN='#89ddff'
%hidden SB_GREEN='#c3e88d'
%hidden SB_ORANGE='#ffcb6b'
%hidden SB_RED='#f07178'
%hidden SB_PURPLE='#c792ea'

# ── status bar: layout ────────────────────────────────────
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-left-length 80
set -g status-right-length 120
set -g status-style "bg=#{SB_BG},fg=#{SB_FG}"

# left: session badge  ›  host / PREFIX / copy-mode
set -g status-left "\
#[fg=#{SB_BG},bg=#{SB_PURPLE},bold]  #S \
#[fg=#{SB_PURPLE},bg=#{SB_PANEL},nobold]\
#{?client_prefix,#[fg=#{SB_ORANGE}]  PREFIX ,\
#{?pane_in_mode,#[fg=#{SB_CYAN}]  #{pane_mode} ,\
#[fg=#{SB_DIM}]  #{host_short} }}\
#[fg=#{SB_PANEL},bg=#{SB_BG}] "

# windows
set -g window-status-separator ""
set -g window-status-format "\
#[fg=#{SB_DIM},bg=#{SB_BG}]  #I  #W\
#{?window_zoomed_flag, ,}#{?window_bell_flag, ,}  "
set -g window-status-current-format "\
#[fg=#{SB_BLUE},bg=#{SB_BG}]\
#[fg=#{SB_BG},bg=#{SB_BLUE},bold] #I  #W\
#{?window_zoomed_flag, ,} \
#[fg=#{SB_BLUE},bg=#{SB_BG},nobold]"
set -g window-status-activity-style "fg=#{SB_ORANGE},bg=#{SB_BG}"
set -g window-status-bell-style "fg=#{SB_RED},bg=#{SB_BG},bold"

# right: cwd  ›  clock  ›  date
set -g status-right "\
#[fg=#{SB_PANEL},bg=#{SB_BG}]\
#[fg=#{SB_GREEN},bg=#{SB_PANEL}]  #{b:pane_current_path} \
#[fg=#{SB_BLUE},bg=#{SB_PANEL}]\
#[fg=#{SB_BG},bg=#{SB_BLUE}]  %H:%M \
#[fg=#{SB_PURPLE},bg=#{SB_BLUE}]\
#[fg=#{SB_BG},bg=#{SB_PURPLE},bold]  %a %d %b "

# ── status bar: accents ───────────────────────────────────
set -g pane-border-lines heavy
set -g pane-border-style "fg=#{SB_PANEL}"
set -g pane-active-border-style "fg=#{SB_BLUE}"
set -g display-panes-colour "#6d6d6d"
set -g display-panes-active-colour "#82aaff"
set -g message-style "fg=#{SB_BG},bg=#{SB_ORANGE},bold"
set -g message-command-style "fg=#{SB_BG},bg=#{SB_CYAN},bold"
set -g mode-style "fg=#{SB_BG},bg=#{SB_PURPLE},bold"
set -g clock-mode-colour "#82aaff"
set -g clock-mode-style 24

# ── clipboard ─────────────────────────────────────────────
set-option -s set-clipboard off
bind C-c run "tmux save-buffer - | xclip -se c -i"
bind C-v run "tmux set-buffer -- \"$(xclip -se c -o)\"; tmux paste-buffer"

unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi v     send-keys -X begin-selection
bind-key -T copy-mode-vi C-v   send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel 'xclip -se c -i'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'xclip -se c -i'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -se c -i'

# ── panes & windows ───────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind r source-file ~/.tmux.conf \; display ".tmux.conf reloaded!"

# ── default session (only on first server start) ──────────
if-shell '! tmux has-session -t=default 2>/dev/null' {
    new-session  -d -s default -n mc mc
    new-window   -d -t default: fish
    new-window   -d -t default: fish
    new-window   -d -t default: zsh
    new-window   -d -t default: bash
    select-window -t default:1
}
