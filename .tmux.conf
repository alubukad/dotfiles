# ── prefix ────────────────────────────────────────────────
unbind-key C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ── terminal ──────────────────────────────────────────────
set -s default-terminal 'tmux-256color'
set -as terminal-features ',xterm-ghostty:RGB:usstyle:hyperlinks'
set -as terminal-features ',alacritty:RGB:usstyle'
set -g allow-passthrough on

# ── general ───────────────────────────────────────────────
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g focus-events on
set -g detach-on-destroy off
set -g mouse on
set -g mode-keys vi
set -g status-keys vi

set-window-option -g automatic-rename on
set-option -g set-titles on
set -g set-titles-string "#T"
set -g status-style 'bg=#333333 fg=#ffffff'
set -g window-status-current-style 'bold bg=blue'

# ── clipboard ─────────────────────────────────────────────
set-option -s set-clipboard off
bind C-c run "tmux save-buffer - | xclip -se c -i"
bind C-v run "tmux set-buffer -- \"$(xclip -se c -o)\"; tmux paste-buffer"

unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi v     send-keys -X begin-selection
bind-key -T copy-mode-vi C-v   send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel 'xclip -se c -i'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'xclip -se c -i'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -se c -i'

# ── panes & windows ───────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind r source-file ~/.tmux.conf \; display ".tmux.conf reloaded!"

# ── default session (only on first server start) ──────────
if-shell '! tmux has-session -t=default 2>/dev/null' {
    new-session  -d -s default -n mc mc
    new-window   -d -t default: fish
    new-window   -d -t default: fish
    new-window   -d -t default: zsh
    new-window   -d -t default: bash
    select-window -t default:1
}
